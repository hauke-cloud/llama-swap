# Default values for llama-swap.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas. llama-swap starts and stops inference processes inside
# its own pod, so every replica loads its own copy of a model and holds its own
# GPU. Keep this at 1 unless each replica has a dedicated GPU and model volume.
replicaCount: 1

# repository and tag are ignored when comfyui.enabled is set: the ComfyUI
# feature is a different image, with its own coordinates under `comfyui.image`.
# pullPolicy applies either way.
image:
  # -- llama-swap image repository.
  repository: ghcr.io/mostlygeek/llama-swap
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # Upstream publishes `v<version>-<backend>-<llama.cpp build>` tags plus a
  # `-non-root` variant of each. The plain variants run as root; the
  # `-non-root` ones as uid/gid 10001, which is what the securityContext below
  # expects. Backends: cpu, cuda, cuda13, rocm, vulkan, intel, musa. For an
  # NVIDIA node use e.g. `v243-cuda-b10133-non-root` and set gpu.enabled=true.
  # An empty value falls back to the chart appVersion, which is not a valid tag
  # on its own, so set this explicitly.
  # -- Image tag, pinning the llama-swap release, the backend and the llama.cpp build.
  tag: "v243-cpu-b10133-non-root"

# -- Secrets for pulling images from a private registry.
imagePullSecrets: []
# -- Override the chart name portion of resource names.
nameOverride: ""
# -- Override the full generated resource name.
fullnameOverride: ""

llamaSwap:
  # -- Port llama-swap listens on inside the container.
  port: 8080
  # The ConfigMap is mounted as a directory so kubelet propagates updates in
  # place. With this enabled the chart drops the config checksum annotation, so
  # the pod is not restarted when the config changes.
  # -- Reload the configuration when the file changes (`--watch-config`).
  watchConfig: false
  # -- Directory the config file is mounted into.
  configMountPath: /etc/llama-swap
  # -- File name of the config within that directory.
  configKey: config.yaml
  # -- Use an existing ConfigMap holding the config file instead of rendering
  # `llamaSwap.config`. It must contain a key matching `llamaSwap.configKey`.
  existingConfigMap: ""
  # -- Extra command line arguments for llama-swap.
  extraArgs: []
  # -- Override the container command. Empty uses the chart's own invocation of
  # the `llama-swap` binary (the image entrypoint hardcodes /app/config.yaml).
  command: []
  # This is the upstream config format 1:1, see
  # https://github.com/mostlygeek/llama-swap/blob/main/config.example.yaml
  # The models below are an example: point `--model` at files that exist on the
  # volume mounted at persistence.models.mountPath (/models by default).
  # Secrets (e.g. `apiKeys`) are better referenced as `${env.NAME}` and injected
  # through envFrom, so they stay out of the ConfigMap.
  # -- llama-swap configuration, rendered into a ConfigMap as config.yaml.
  config:
    # Seconds to wait for an upstream server to become healthy after starting.
    # Loading a large model from cold storage can easily exceed the default.
    healthCheckTimeout: 500
    logLevel: info
    # First port handed out to upstream servers via the ${PORT} macro.
    startPort: 10001
    macros:
      "llama-server": >
        llama-server --host 127.0.0.1 --port ${PORT}
    models:
      "qwen3-0.6b":
        cmd: |
          ${llama-server}
          --model /models/Qwen3-0.6B-Q4_K_M.gguf
          --ctx-size 8192
        # Unload the model after 300s idle.
        ttl: 300
        aliases:
          - "gpt-3.5-turbo"

# ComfyUI, from the combined image at
# https://github.com/hauke-cloud/llama-swap-comfyui. ComfyUI is installed next
# to llama-swap and registered as a swappable model, so it shares llama-swap's
# default exclusive group with every llama.cpp model: starting ComfyUI unloads
# the resident LLM and vice versa — one GPU, one workload at a time. It is
# reached through llama-swap's own port — at /comfyui/ with the default model
# id, see `name` below — and needs no Service or Ingress of its own.
comfyui:
  # -- Run the llama-swap + ComfyUI image and register ComfyUI as a model.
  # Replaces `image` with `comfyui.image` and mounts the ComfyUI data volume.
  enabled: false
  # Tag names mirror upstream's `v<version>-<backend>-b<build>[-non-root]`
  # scheme, plus the floating `cuda`, `cuda13` and `-non-root` variants. Only
  # CUDA backends are built, because ComfyUI needs a PyTorch accelerator. Old
  # tags are pruned upstream (the 40 most recent are kept), which is why the
  # default is a floating tag rather than a pinned build; pin one for
  # reproducible rollouts and update it deliberately.
  image:
    # -- ComfyUI image repository.
    repository: ghcr.io/hauke-cloud/llama-swap-comfyui
    # -- ComfyUI image tag. `-non-root` matches the uid/gid the securityContext expects.
    tag: "cuda-non-root"
  # Set to false when you bring the `comfyui` entry yourself, either through
  # `llamaSwap.existingConfigMap` or by writing it into `llamaSwap.config`. An
  # entry that already exists under `comfyui.name` is never overwritten.
  # -- Add the ComfyUI model entry to the rendered config.
  injectModel: true
  # llama-swap has first-class support for one specific model id: `comfyui_auto`
  # is served at /comfyui/ (rather than the generic /upstream/<name>/), its
  # concurrency limit is raised to 50, and websockets are excluded from model
  # lifecycle tracking. That last part matters — ComfyUI holds a progress
  # websocket open for as long as a browser tab is, and without it that idle
  # tab counts as activity, so the ttl below never fires and the LLM never gets
  # the GPU back. It landed in llama-swap v249; on anything older, or under any
  # other name, this falls back to /upstream/<name>/ and the two settings below
  # supply the same behaviour by hand.
  # -- Key of the model entry. `comfyui_auto` unlocks llama-swap's built-in
  # ComfyUI route at /comfyui/; any other value is proxied at /upstream/<name>/.
  name: comfyui_auto
  # ComfyUI's frontend fans out a lot of parallel requests, and llama-swap
  # queues anything above this per model.
  # -- Concurrent requests allowed to ComfyUI.
  concurrencyLimit: 50
  # -- Keep websockets out of swap, concurrency and TTL accounting, so an open
  # browser tab does not pin ComfyUI to the GPU forever.
  ignoreWebsockets: true
  # -- Display name in the llama-swap UI.
  displayName: ComfyUI
  # -- Description in the llama-swap UI.
  description: "ComfyUI web UI and API"
  # ComfyUI is not OpenAI-compatible, so listing it only hands chat clients a
  # model that 404s. Set to false to see it in the UI's model list.
  # -- Hide ComfyUI from /v1/models.
  unlisted: true
  # -- Seconds of inactivity after which ComfyUI is stopped and the GPU freed.
  ttl: 900
  # Models not assigned to a group land in llama-swap's default group, which is
  # exclusive — so with no `groups` in the config, loading ComfyUI unloads the
  # resident LLM and vice versa, which is the point of running it here. As soon
  # as the config defines its own groups, that no longer holds: ComfyUI stays in
  # the default group and would run beside a group member, both claiming the
  # same GPU. Name the group holding the llama.cpp models here and ComfyUI is
  # added to its members.
  # -- Group to add ComfyUI to. Empty leaves it in the default group.
  group: ""
  # -- Where ComfyUI is installed in the image. Holds `app/` and the `venv/`
  # that torch lives in.
  home: /opt/comfyui
  # Importing torch and starting the model manager on a cold cache takes a
  # while; llama-swap gives up after `llamaSwap.config.healthCheckTimeout`
  # seconds, so keep that generous when ComfyUI is enabled.
  # -- Endpoint llama-swap polls to decide ComfyUI is up. ComfyUI does not
  # serve llama.cpp's /health.
  checkEndpoint: /system_stats
  # A second Ingress, on its own hostname, that serves ComfyUI at the host root
  # instead of under llama-swap's ComfyUI path prefix. The main `ingress`
  # already reaches ComfyUI at that prefix; this one exists to give it a URL of
  # its own. Both point at the same Service and the same port — llama-swap is
  # still the only thing listening.
  ingress:
    # -- Expose ComfyUI through an Ingress of its own.
    enabled: false
    # -- IngressClass name. Unlike `ingress.className` this does not default to
    # anything; empty uses the cluster's default IngressClass.
    className: ""
    # ComfyUI holds a WebSocket open for progress updates and uploads whole
    # images, so the same timeouts the main Ingress needs apply here, e.g. for
    # ingress-nginx:
    #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    #   nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # Anything set here wins over the rewrite annotations the chart adds.
    # -- Annotations for the ComfyUI Ingress.
    annotations: {}
    # Rewriting is what makes the host root work: the browser asks for /foo and
    # the controller forwards /upstream/<name>/foo. ComfyUI derives its API base
    # from the page URL, so the UI, /api and the WebSocket all follow along.
    # This emits ingress-nginx's `rewrite-target` and `use-regex` annotations
    # and turns each path into the matching regex, which makes `pathType` below
    # ImplementationSpecific.
    #
    # Set to false on any other controller and do one of:
    #   - point `path` at ComfyUI's path (/comfyui) and live with the longer
    #     URL, or
    #   - add your controller's own rewrite (a Traefik middleware, a Gateway API
    #     URLRewrite filter) through `annotations`.
    # Leaving it false with `path: /` publishes all of llama-swap — its API and
    # UI included — on this hostname.
    # -- Rewrite the host root onto ComfyUI's path using ingress-nginx annotations.
    rewrite: true
    # -- Ingress host rules. Serving ComfyUI from a subpath works too: set
    # `path` to e.g. /comfy and it is rewritten onto ComfyUI's path.
    hosts:
      - host: comfyui.local
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration.
    tls: []

  # Gateway API counterpart of `comfyui.ingress` above. The rewrite that makes
  # the host root work is a standard URLRewrite filter here, so unlike the
  # Ingress it needs nothing controller-specific.
  httpRoute:
    # -- Expose ComfyUI through a Gateway API HTTPRoute of its own.
    enabled: false
    # -- Annotations for the HTTPRoute.
    annotations: {}
    # -- Extra labels for the HTTPRoute.
    labels: {}
    # -- Gateways this route attaches to.
    parentRefs:
      - name: hauke-cloud
        namespace: envoy-gateway
    # -- Hostnames served by this route.
    hostnames:
      - comfyui.local
    # -- Rewrite the matched prefix onto ComfyUI's path with a URLRewrite
    # filter, so the browser asks for /foo and llama-swap sees /comfyui/foo.
    # Leaving this false with `paths: ["/"]` publishes all of llama-swap — its
    # API and UI included — on this hostname.
    rewrite: true
    # A trailing slash here is dropped: Envoy Gateway trims one on the way into
    # Envoy's prefix_rewrite, so the host root lands on /comfyui and llama-swap
    # redirects it to /comfyui/. The rendered route publishes this prefix as a
    # second, unrewritten rule so that redirect resolves.
    # -- Prefix the request is rewritten onto. Empty derives it from `comfyui.name`.
    replacePrefixMatch: ""
    # -- Path prefixes matched on those hostnames. Serving ComfyUI from a
    # subpath works too: use e.g. /comfy and it is rewritten onto ComfyUI's path.
    paths:
      - /
    # ComfyUI uploads whole images and holds a websocket open for progress
    # updates, so the same reasoning as `httpRoute.timeouts` applies.
    # -- Per-request timeouts.
    timeouts:
      request: 0s
      backendRequest: 0s
    # -- Route rules. Empty builds them from `paths` and `rewrite` above; set
    # this to take full control, and `paths`/`rewrite` are then ignored.
    rules: []
  # -- Extra command line arguments for ComfyUI, e.g. ["--fast", "--preview-method", "auto"].
  extraArgs: []
  # -- Override the ComfyUI command entirely. Empty builds it from the values
  # above. Multi-line string, passed to llama-swap as the model's `cmd`.
  cmd: ""

# -- Environment variables for the container (list of name/value or
# name/valueFrom). Referenced from the config as `${env.NAME}`.
env: []
# Example:
#   - secretRef:
#       name: llama-swap-apikeys
# -- Additional envFrom sources, e.g. a Secret holding API keys.
envFrom: []

serviceAccount:
  # -- Create a ServiceAccount for the pod.
  create: true
  # -- Automatically mount the ServiceAccount's API token.
  automount: false
  # -- Annotations to add to the ServiceAccount.
  annotations: {}
  # -- Name of the ServiceAccount. Generated if empty and create is true.
  name: ""

# -- Annotations to add to the pod.
podAnnotations: {}
# -- Labels to add to the pod.
podLabels: {}

# -- Pod-level security context. fsGroup makes the mounted volumes writable by
# the unprivileged user of the `-non-root` images.
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

# Matches the uid/gid of the `-non-root` image variants; drop the runAs* keys
# when using a plain (root) tag. readOnlyRootFilesystem stays off because
# llama.cpp backends write compiler and kernel caches below $HOME (/app).
# -- Container-level security context.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

gpu:
  # -- Request a GPU for the pod. Requires a matching device plugin and a GPU
  # image variant (see image.tag).
  enabled: false
  # -- Extended resource name, e.g. nvidia.com/gpu, amd.com/gpu,
  # gpu.intel.com/i915.
  resourceName: nvidia.com/gpu
  # -- Number of devices to request. Added to resources.limits.
  count: 1

# -- RuntimeClass for the pod, e.g. "nvidia" on clusters that need it.
runtimeClassName: ""

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 8080
  # -- Annotations to add to the Service.
  annotations: {}

# /metrics exposes llama-swap's performance metrics (CPU, RAM, network, GPU)
# in Prometheus format on the same port as everything else. Both resources
# below use the Prometheus Operator CRDs and are off by default.
metrics:
  serviceMonitor:
    # -- Create a ServiceMonitor scraping /metrics. Requires the monitoring.coreos.com CRDs.
    enabled: false
    # -- Namespace the ServiceMonitor is created in. Empty uses the release
    # namespace. Prometheus often watches other namespaces, so point this at
    # its own when the Service is scraped from a different one.
    namespace: ""
    # -- How often Prometheus scrapes /metrics.
    interval: 30s
    # -- Give up on a scrape after this long.
    scrapeTimeout: 10s
    # -- Extra labels for the ServiceMonitor. Prometheus instances commonly
    # select on a label like `release: prometheus`, which belongs here.
    labels: {}
    # -- Annotations for the ServiceMonitor.
    annotations: {}
  prometheusRule:
    # -- Create a PrometheusRule with a default set of alerts. Requires the monitoring.coreos.com CRDs.
    enabled: false
    # -- Namespace the PrometheusRule is created in. Empty uses the release
    # namespace.
    namespace: ""
    # -- Extra labels for the PrometheusRule.
    labels: {}
    # -- Annotations for the PrometheusRule.
    annotations: {}
    # -- Alerting rules. Empty uses the chart's defaults, which match on the
    # `service` label the Prometheus Operator derives from this chart's
    # Service, so they work regardless of the scrape's job name.
    rules: []
  grafanaDashboard:
    # -- Create a ConfigMap holding the llama-swap Grafana dashboard, labelled
    # `grafana_dashboard: "1"` for the grafana-k8s-sidecar. The dashboard covers
    # all llamaswap_* metrics: GPU utilization, memory, temperature, power, fan,
    # CPU, load average, system memory, swap, network I/O, and — when
    # metrics.tokenExporter is enabled — per-model token counts, cache hits and
    # prefill/generation throughput.
    enabled: false
    # -- Namespace the dashboard ConfigMap is created in. Empty uses the
    # release namespace.
    namespace: ""
    # -- Grafana folder the sidecar imports the dashboard into. Requires the
    # sidecar's folder feature to be enabled.
    folder: ""
    # -- Extra labels for the ConfigMap.
    labels: {}
    # -- Extra annotations for the ConfigMap. The folder annotation is added
    # automatically when `folder` is set.
    annotations: {}
  tokenExporter:
    # -- Run the llama-token-metrics-exporter as a sidecar to export
    # llama-swap's per-model token counts and inference throughput as
    # Prometheus metrics. It polls /v1/models and each model's
    # /api/metrics/stats in the background and serves the snapshot on its own
    # /metrics, so a scrape never reaches llama-swap. The ServiceMonitor
    # scrapes that endpoint on the port below. See
    # https://github.com/hauke-cloud/llama-token-metrics-exporter.
    enabled: false
    # -- Port the exporter listens on inside the container.
    port: 9782
    image:
      # -- Exporter image repository.
      repository: ghcr.io/hauke-cloud/llama-token-metrics-exporter
      # -- Exporter image tag.
      tag: "latest"
      # -- Image pull policy.
      pullPolicy: IfNotPresent
    # -- URL of llama-swap as seen from the sidecar. Empty derives
    # `http://127.0.0.1:<llamaSwap.port>`, which works in the shared pod
    # network namespace.
    llamaSwapUrl: ""
    # -- Gap between polls of the llama-swap API.
    pollInterval: 30s
    # -- Timeout for a single API request.
    requestTimeout: 10s
    # -- Per-model statistics requests in flight at once.
    concurrency: 4
    # -- Also export the unlabelled aggregate across every model
    # (llamaswap_activity_*).
    includeTotals: true
    # -- Which /v1/models entry types to collect: model, alias, peer, selector.
    # Aliases and selectors resolve to another model before llama-swap writes
    # its activity log, so their statistics stay zero.
    modelTypes:
      - model
    # -- Log level: debug, info, warn, error.
    logLevel: info
    # -- Log format: text or json.
    logFormat: json
    # API key for llama-swap instances that declare `apiKeys`. Mount it from a
    # Secret file so it stays out of the process environment and of
    # `kubectl describe pod`.
    apiKey:
      # -- Name of the Secret holding the API key. Empty sends no key.
      existingSecret: ""
      # -- Key within that Secret.
      key: api-key
    # Liveness only, deliberately. A readinessProbe on any container gates the
    # whole pod, so an exporter that could not reach llama-swap would pull
    # llama-swap itself out of its Service. /healthz never depends on
    # llama-swap, so this restarts the sidecar only if it is truly wedged.
    # Scrape health lives in `up` and llamaswap_exporter_api_up.
    # -- Liveness probe for the sidecar.
    livenessProbe:
      httpGet:
        path: /healthz
        port: token-metrics
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    # -- Resource requests and limits for the sidecar.
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

ingress:
  # -- Expose llama-swap through an Ingress.
  enabled: false
  # -- IngressClass name.
  className: ""
  # Token streaming and cold model loads hold connections open for a long time,
  # so raise the proxy timeouts, e.g. for ingress-nginx:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-body-size: "0"
  # -- Annotations for the Ingress.
  annotations: {}
  # -- Ingress host rules.
  hosts:
    - host: llama-swap.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration.
  tls: []

# Gateway API counterpart of `ingress` above, for clusters running an API
# gateway (Envoy Gateway, Istio, Cilium) instead of an Ingress controller. The
# two are independent: enable both while a cluster migrates, then drop the
# Ingress. TLS is not configured here — a Gateway terminates it on its listener,
# not per route.
httpRoute:
  # -- Expose llama-swap through a Gateway API HTTPRoute.
  enabled: false
  # -- Annotations for the HTTPRoute.
  annotations: {}
  # -- Extra labels for the HTTPRoute.
  labels: {}
  # A parentRef in another namespace is only accepted if that Gateway's listener
  # allows routes from this one. `sectionName` pins the route to a single
  # listener; leaving it out attaches it to every listener whose hostname
  # matches.
  # -- Gateways this route attaches to.
  parentRefs:
    - name: hauke-cloud
      namespace: envoy-gateway
  # -- Hostnames served by this route. Each must match a listener hostname on
  # the parent Gateway.
  hostnames:
    - llama-swap.local
  # Token streaming and cold model loads hold a request open for minutes, well
  # past the 15s Envoy applies by default. "0s" disables the timeout, which is
  # what the proxy-read-timeout/proxy-send-timeout annotations do on
  # ingress-nginx. Applied to every rule that does not set its own.
  # -- Per-request timeouts.
  timeouts:
    request: 0s
    backendRequest: 0s
  # -- Route rules. Empty emits one rule matching everything under `/`. Entries
  # without `backendRefs` are pointed at this chart's Service, so a rule usually
  # only carries `matches` and `filters`.
  rules: []

persistence:
  models:
    # -- Mount a volume holding the model files. Without it the container has
    # nowhere to read GGUFs from.
    enabled: true
    # -- Where the models volume is mounted.
    mountPath: /models
    # -- Mount the models read-only.
    readOnly: false
    # -- Use an existing (usually prepopulated) PVC instead of provisioning a
    # new, empty one. Mutually exclusive with hostPath.
    existingClaim: ""
    # For single-node setups where the models already sit on the GPU node's
    # disk. Requires a nodeSelector pinning the pod to that node.
    # -- Use a host directory instead of a PVC. Mutually exclusive with existingClaim.
    hostPath: ""
    # -- StorageClass. Empty uses the cluster default; "-" disables dynamic
    # provisioning.
    storageClass: ""
    # -- Access modes. ReadWriteMany lets other pods top the volume up while
    # llama-swap runs, if the backend supports it.
    accessModes:
      - ReadWriteOnce
    # -- Volume size. Model weights are large; size for what you plan to host.
    size: 100Gi
    # -- Annotations for the PVC.
    annotations: {}
    # -- Keep the PVC when the release is uninstalled.
    retain: true
  data:
    # Only useful together with a `store` entry in the config pointing into
    # mountPath; without it llama-swap keeps its state in memory.
    # -- Persist llama-swap's state database (activity log and metrics history).
    enabled: false
    # -- Where the state volume is mounted.
    mountPath: /data
    # -- Use an existing PVC instead of provisioning one.
    existingClaim: ""
    # -- StorageClass. Empty uses the cluster default; "-" disables dynamic
    # provisioning.
    storageClass: ""
    # -- Access modes.
    accessModes:
      - ReadWriteOnce
    # -- Volume size.
    size: 1Gi
    # -- Annotations for the PVC.
    annotations: {}
    # -- Keep the PVC when the release is uninstalled.
    retain: true

  comfyui:
    # Only used when comfyui.enabled is set. ComfyUI is passed this path as
    # `--base-directory`, so checkpoints, custom nodes, inputs, outputs and its
    # user settings all live under it. Without the volume they are lost with
    # the container.
    # -- Mount a volume holding ComfyUI's models and state.
    enabled: true
    # -- Where the ComfyUI data volume is mounted. Matches the image default.
    mountPath: /data/comfyui
    # -- Use an existing PVC instead of provisioning one.
    existingClaim: ""
    # -- Use a host directory instead of a PVC. Mutually exclusive with existingClaim.
    hostPath: ""
    # -- StorageClass. Empty uses the cluster default; "-" disables dynamic
    # provisioning.
    storageClass: ""
    # -- Access modes.
    accessModes:
      - ReadWriteOnce
    # -- Volume size. Diffusion checkpoints are large; size for what you plan
    # to install.
    size: 50Gi
    # -- Annotations for the PVC.
    annotations: {}
    # -- Keep the PVC when the release is uninstalled.
    retain: true

shm:
  # Some backends move tensors between GPUs through shared memory and fail with
  # the 64Mi the container runtime provides by default.
  # -- Replace the default 64Mi /dev/shm with a larger tmpfs.
  enabled: false
  # -- Size of the /dev/shm tmpfs. Counts against the container's memory limit.
  sizeLimit: 1Gi

# -- Size limit of the emptyDir mounted at /tmp.
tmpSizeLimit: 1Gi

# Inference is memory hungry: a model needs roughly its file size in RAM (or
# VRAM) plus the KV cache. GPU devices are added by the `gpu` block above.
# -- Resource requests and limits.
resources: {}
  # limits:
  #   cpu: "8"
  #   memory: 16Gi
  # requests:
  #   cpu: "2"
  #   memory: 8Gi

# /health is served by the proxy itself and is exempt from API key checks, so
# it stays green while models are loading or swapping.
# -- Liveness probe.
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe.
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Generous by default: with `hooks.on_startup.preload` in the config, the proxy
# answers only once the preloaded models are up.
# -- Startup probe.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

# -- Additional volumes on the pod.
extraVolumes: []
# -- Additional volumeMounts on the container.
extraVolumeMounts: []

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling. GPU nodes are commonly tainted.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
# -- Topology spread constraints.
topologySpreadConstraints: []
# llama-swap forwards the signal to the upstream servers it started and waits
# for in-flight requests to finish.
# -- Grace period on shutdown.
terminationGracePeriodSeconds: 120
# Recreate is the default because a ReadWriteOnce models volume and a GPU
# cannot be shared with a second pod during a rollout.
# -- Deployment update strategy.
strategy:
  type: Recreate
