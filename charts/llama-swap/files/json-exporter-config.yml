modules:
  default:
    metrics:
    - name: llamaswap_total_requests
      path: '{ .total_requests }'
      help: Total number of requests processed by llama-swap.
    - name: llamaswap_total_input_tokens
      path: '{ .total_input_tokens }'
      help: Total input tokens processed by llama-swap.
    - name: llamaswap_total_output_tokens
      path: '{ .total_output_tokens }'
      help: Total output tokens generated by llama-swap.
    - name: llamaswap_total_cache_tokens
      path: '{ .total_cache_tokens }'
      help: Total cache tokens hit by llama-swap.
    - name: llamaswap_prompt_time_ms
      type: object
      path: '{ .prompt_histogram }'
      help: Prompt (prefill) processing time in milliseconds.
      values:
        p50: '{ .p50 }'
        p95: '{ .p95 }'
        p99: '{ .p99 }'
        min: '{ .min }'
        max: '{ .max }'
    - name: llamaswap_generation_time_ms
      type: object
      path: '{ .gen_histogram }'
      help: Token generation time in milliseconds per token.
      values:
        p50: '{ .p50 }'
        p95: '{ .p95 }'
        p99: '{ .p99 }'
        min: '{ .min }'
        max: '{ .max }'
