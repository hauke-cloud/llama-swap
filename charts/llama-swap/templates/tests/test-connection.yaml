apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "llama-swap.fullname" . }}-test-connection"
  labels:
    {{- include "llama-swap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - '--spider'
        - '-S'
        - '{{ include "llama-swap.fullname" . }}:{{ .Values.service.port }}/health'
