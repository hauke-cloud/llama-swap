{{- include "llama-swap.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llama-swap.fullname" . }}
  labels:
    {{- include "llama-swap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "llama-swap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations (and (not .Values.llamaSwap.existingConfigMap) (not .Values.llamaSwap.watchConfig)) }}
      annotations:
        {{- if and (not .Values.llamaSwap.existingConfigMap) (not .Values.llamaSwap.watchConfig) }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "llama-swap.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "llama-swap.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "llama-swap.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The image entrypoint points at the config baked into the image, so
          # the command is replaced to load the mounted one instead.
          command:
            {{- if .Values.llamaSwap.command }}
            {{- toYaml .Values.llamaSwap.command | nindent 12 }}
            {{- else }}
            - llama-swap
            {{- end }}
          args:
            - --config
            - {{ include "llama-swap.configPath" . }}
            - --listen
            - ":{{ .Values.llamaSwap.port }}"
            {{- if .Values.llamaSwap.watchConfig }}
            - --watch-config
            {{- end }}
            {{- range .Values.llamaSwap.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.llamaSwap.port }}
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "llama-swap.resources" . | fromYaml) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.llamaSwap.configMountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.models.enabled }}
            - name: models
              mountPath: {{ .Values.persistence.models.mountPath }}
              readOnly: {{ .Values.persistence.models.readOnly }}
            {{- end }}
            {{- if .Values.persistence.data.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.data.mountPath }}
            {{- end }}
            {{- if include "llama-swap.comfyuiVolumeEnabled" . }}
            - name: comfyui
              mountPath: {{ .Values.persistence.comfyui.mountPath }}
            {{- end }}
            {{- if .Values.shm.enabled }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.metrics.tokenExporter.enabled }}
        - name: token-metrics-exporter
          image: {{ .Values.metrics.tokenExporter.image.repository }}:{{ .Values.metrics.tokenExporter.image.tag }}
          imagePullPolicy: {{ .Values.metrics.tokenExporter.image.pullPolicy }}
          env:
            - name: LLAMA_SWAP_URL
              {{- if .Values.metrics.tokenExporter.llamaSwapUrl }}
              value: {{ .Values.metrics.tokenExporter.llamaSwapUrl | quote }}
              {{- else }}
              value: {{ printf "http://127.0.0.1:%v" .Values.llamaSwap.port | quote }}
              {{- end }}
            - name: POLL_INTERVAL
              value: {{ .Values.metrics.tokenExporter.pollInterval | quote }}
            - name: REQUEST_TIMEOUT
              value: {{ .Values.metrics.tokenExporter.requestTimeout | quote }}
            - name: CONCURRENCY
              value: {{ .Values.metrics.tokenExporter.concurrency | quote }}
            - name: INCLUDE_TOTALS
              value: {{ .Values.metrics.tokenExporter.includeTotals | quote }}
            - name: MODEL_TYPES
              value: {{ join "," .Values.metrics.tokenExporter.modelTypes | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.metrics.tokenExporter.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.metrics.tokenExporter.logFormat | quote }}
            {{- if .Values.metrics.tokenExporter.apiKey.existingSecret }}
            - name: LLAMA_SWAP_API_KEY_FILE
              value: /etc/llama-token-metrics-exporter/api-key
            {{- end }}
          ports:
            - name: token-metrics
              containerPort: {{ .Values.metrics.tokenExporter.port }}
              protocol: TCP
          {{- with .Values.metrics.tokenExporter.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.metrics.tokenExporter.resources | nindent 12 }}
          {{- if .Values.metrics.tokenExporter.apiKey.existingSecret }}
          volumeMounts:
            - name: token-exporter-api-key
              mountPath: /etc/llama-token-metrics-exporter
              readOnly: true
          {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "llama-swap.configMapName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- if .Values.persistence.models.enabled }}
        - name: models
          {{- if .Values.persistence.models.hostPath }}
          hostPath:
            path: {{ .Values.persistence.models.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "llama-swap.modelsClaimName" . }}
          {{- end }}
        {{- end }}
        {{- if .Values.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "llama-swap.dataClaimName" . }}
        {{- end }}
        {{- if include "llama-swap.comfyuiVolumeEnabled" . }}
        - name: comfyui
          {{- if .Values.persistence.comfyui.hostPath }}
          hostPath:
            path: {{ .Values.persistence.comfyui.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "llama-swap.comfyuiClaimName" . }}
          {{- end }}
        {{- end }}
        {{- if .Values.shm.enabled }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm.sizeLimit }}
        {{- end }}
        {{- if and .Values.metrics.tokenExporter.enabled .Values.metrics.tokenExporter.apiKey.existingSecret }}
        - name: token-exporter-api-key
          secret:
            secretName: {{ .Values.metrics.tokenExporter.apiKey.existingSecret }}
            items:
              - key: {{ .Values.metrics.tokenExporter.apiKey.key }}
                path: api-key
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
