{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "llama-swap.fullname" . }}
  {{- if .Values.metrics.prometheusRule.namespace }}
  namespace: {{ .Values.metrics.prometheusRule.namespace }}
  {{- end }}
  labels:
    {{- include "llama-swap.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.prometheusRule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: {{ include "llama-swap.fullname" . }}
      rules:
        {{- if .Values.metrics.prometheusRule.rules }}
        {{- toYaml .Values.metrics.prometheusRule.rules | nindent 8 }}
        {{- else }}
        {{- include "llama-swap.defaultPrometheusRules" . | nindent 8 }}
        {{- end }}
{{- end }}
